<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bb-claro" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#102042" />
      <stop offset="100%" stop-color="#091326" />
    </linearGradient>
    <radialGradient id="bg-claro" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.20)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="zg-claro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="ag-claro" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="sf-claro" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <filter id="ds-claro" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <clipPath id="cp-claro">
      <rect x="2" y="2" width="96" height="96" rx="24" />
    </clipPath>
  </defs>

  <!-- Fundo squircle -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bb-claro)" />
  <circle cx="50" cy="45" r="40" fill="url(#bg-claro)" />

  <g clip-path="url(#cp-claro)">
    <!-- Arco decorativo semicircular atras do Z -->
    <path
      d="M 18 68 A 34 34 0 0 1 82 68"
      stroke="url(#ag-claro)"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
      opacity="0.45"
    />

    <!-- Z geometrico bold — bloco estilizado -->
    <g filter="url(#ds-claro)">
      <!-- Barra superior do Z -->
      <path
        d="M 24 26 H 76 L 74 36 H 42"
        fill="url(#zg-claro)"
      />
      <!-- Diagonal do Z -->
      <path
        d="M 42 36 L 74 36 L 58 64 L 26 64"
        fill="url(#zg-claro)"
        opacity="0.85"
      />
      <!-- Barra inferior do Z -->
      <path
        d="M 26 64 H 58 L 24 74 H 76 L 58 64"
        fill="url(#zg-claro)"
      />
      <!-- Highlight de brilho na aresta superior -->
      <path
        d="M 24 26 H 76"
        stroke="rgba(255,255,255,0.5)"
        stroke-width="1"
        stroke-linecap="round"
      />
    </g>

    <!-- Sparkle / Estrela no canto superior direito -->
    <circle cx="78" cy="22" r="10" fill="url(#sf-claro)" />
    <path
      d="M 78 14 Q 78 22 72 22 Q 78 22 78 30 Q 78 22 84 22 Q 78 22 78 14 Z"
      fill="#FFFFFF"
    />
    <circle cx="78" cy="22" r="1.4" fill="#FFFFFF" />
  </g>

  <!-- Bordas do squircle -->
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="rgba(56, 189, 248, 0.30)" stroke-width="1.2" fill="none" />
  <rect x="3.5" y="3.5" width="93" height="93" rx="22.5" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8" fill="none" />
</svg>